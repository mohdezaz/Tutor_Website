<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Tutor at Your Fingertip</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="contact-us">
            <h1>Contact Us</h1>
            <p>If you have any questions or would like to learn more about our services, please don't hesitate to get in touch.</p>

            <div class="contact-info">
                <p><strong>Mobile:</strong> +917291878414</p>
                <p><strong>WhatsApp:</strong> +917291878414</p>
                <p><strong>Email:</strong> tutoratyourfingertip@gmail.com</p>
            </div>

            <form action="mailto:tutoratyourfingertip@gmail.com" method="post" enctype="text/plain">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit" class="cta-button">Send Message</button>
            </form>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        fetch('../header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            });
        fetch('../footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
</body>
</html>
