<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Trial - Tutor at Your Fingertip</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap">
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="free-trial">
            <h1>Book Your Free Trial Session</h1>
            <p>Fill out the form below to schedule a free, no-obligation trial session with one of our expert tutors.</p>
            <form action="mailto:tutoratyourfingertip@gmail.com" method="post" enctype="text/plain">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="subject">Subject:</label>
                <select id="subject" name="subject" required>
                    <option value="">Select a Subject</option>
                    <option value="Maths">Maths</option>
                    <option value="Physics">Physics</option>
                    <option value="Chemistry">Chemistry</option>
                    <option value="Biology">Biology</option>
                </select>

                <label for="board">Board:</label>
                <select id="board" name="board" required>
                    <option value="">Select a Board</option>
                    <option value="GCSE">GCSE</option>
                    <option value="GCE">GCE</option>
                    <option value="IB">IB</option>
                    <option value="High School">High School</option>
                </select>

                <button type="submit" class="cta-button">Book Now</button>
            </form>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        fetch('../header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('header-placeholder').innerHTML = data;
            });
        fetch('../footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            });
    </script>
</body>
</html>
